name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Tests (${{ toJSON(matrix) }})

    strategy:
      matrix:
        django-version: ['5.2', '6.0', '6.1']
        python-version: ['3.11', '3.12', '3.13', '3.14']
        working-directory: ['./packages/hidp']
        exclude:
          - django-version: '6.0'
            python-version: '3.11'
          - django-version: '6.1'
            python-version: '3.11'
        include:
          - working-directory: './project'
            python-version: '3.12'
            django-version: '5.2'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Django checks & tests
        uses: ./.github/actions/python-qa
        with:
          working-directory: ${{ matrix.working-directory }}
          django-version: ${{ matrix.django-version }}
          python-version: ${{ matrix.python-version }}
          # The test cells only run the Django version sensitive targets,
          # version independent tooling runs in the toolchain job.
          make-targets: django-checks coveragetest

  toolchain:
    name: Linting, migration & message checks, documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          working-directory: './packages/hidp'
          python-version: '3.14'
          django-version: '5.2'

      - name: Lint, check and build
        run: |
          make lint migrationtest checkmessages docs
        working-directory: ./packages/hidp
        shell: bash
        env:
          RUFF_OUTPUT_FORMAT: github

  # Report success/failure
  success:
    name: Success
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - test
      - toolchain
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
